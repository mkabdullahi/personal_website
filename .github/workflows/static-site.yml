name: Static Site CI/CD

# Run on pushes and PRs to main or develop
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-deploy:
    runs-on: ubuntu-latest
    # Cache node_modules to speed up subsequent runs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node is already available on ubuntu‑latest; we just need it for npx commands.
      - name: Set up Node.js (optional, ensures a stable version)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---------- Lint matrix ----------
      - name: Lint HTML
        run: |
          npx html-validate "**/*.html" || echo "HTML validation issues found"

      - name: Lint CSS
        run: |
          npx stylelint "**/*.css" --fix || npx stylelint "**/*.css" || echo "CSS linting issues found"

      - name: Lint JavaScript
        run: |
          npx eslint "**/*.js" --fix || npx eslint "**/*.js" || echo "JavaScript linting issues found"

      # GitHub Pages deploys automatically from the main branch
      # (Settings → Pages → Source: "Deploy from a branch"), so no
      # separate deploy/minify step is needed here.